<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Information about the page, not shown on it -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Basic Portfolio</title>

    <style>
        /* 1. GENERAL STYLES */
        body {
            font-family: Arial, sans-serif;
            background-color: #e0d5d0;
            color: #6b4f59;
            margin: 0;
            padding: 0;
        }
        /* 2. HEADER STYLES */
        header {
            background-color: #c0b4b8;
            color: #634851;
            text-align: center; 
            padding: 40px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 36px;
        }
        header p {
            margin-top: 10px;
            font-size: 18px;
            color: #866873;
        }
        /* 3. MAIN CONTENT STYLES */
        main {
            padding: 40px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        /* 4. FLEXBOX CONTAINER FOR CARDS */
        #skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        /* 5. INDIVIDUAL CARD STYLES */
        .skill-card {
            position: relative;
            background-color: #866873;
            border-radius: 20px;
            padding: 18px;
            width: 500px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-top: 10px solid #7c5f69;
        }
        .toggle-icon {
            position: absolute;
            top: 5px;
            right: 16px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #ceb2ba;
            line-height: 1;
        }
        .skill-card h3 {
            margin-top: 0;
            color: #e2cfd4;
        }
        .skill-card p {
            font-size: 18px;
            color: #ccb9be;
            line-height: 1.5;
        }
        .skill-card.selected {
            border: 2px solid #7c5f69;
            background-color: #866873;
            transform: scale(1.03);
        }
        .skill-card button {
            margin-top: 12px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background-color: #7c5f69;
            color: #866873;
            font-size: 14px;
            cursor: pointer;
        }
        .skill-card button:hover {
            background-color: #7c5f69;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align: center; margin-bottom: 30px;">Jo-D's Portfolio</h1>
        <p style="text-align: center; margin-bottom: 1px;">Welcome to my little portfolio. Here are some of the skills I've developed whilst learning to code.</p>
    </header>
<main>
    <h2 style="text-align: center; margin-bottom: 10px;">My Skills</h2>
    <div id="skills-container">
    </div>
</main>

<script>
    const mySkills = [
        {
            name: "HTML",
            description: "HTML is the backbone of my website, providing structure and content."
        },
        {
            name: "CSS",
            description: "I used CSS to add colors, layouts, and make things look pretty."
        },
        {
            name: "JavaScript",
            description: "I used JavaScript to make my website interactive, like the skill cards that expand when clicked."
        },
        {
            name: "Problem Solving",
            description: "I ran into some problems while coding, but I learned to solve them by researching and working together with others."
        },
        {
            name: "Visual Studio Code",
            description: "I used Visual Studio Code as my main code editor, which helped me write and organize my code efficiently."
        },
        {
            name: "GitHub",
            description: "I used GitHub to store my code and upload my portfolio, making it easy to track changes and share my work."
        },  
        {
            name: "Python",
            description: "I also used Python to create a turtle rover mini game."
        },
    ];

    const container = document.getElementById("skills-container");

    mySkills.forEach(function(skill) {
        // a) create an empty <div>
        const cardElement = document.createElement("div");

        // b) give it the class our CSS styles
        cardElement.className = "skill-card";

        // c) put HTML inside the card
        cardElement.innerHTML = `
            <span class="toggle-icon">+</span>
            <h3>${skill.name}</h3>
        `;

        // d) the description, hidden at first
        const details = document.createElement('p');
        details.textContent = skill.description;
        details.style.display = 'none';
        cardElement.appendChild(details);

        // f) react to a click
        cardElement.addEventListener('click', function() {
            const icon = cardElement.querySelector('.toggle-icon');
            const isHidden = details.style.display === 'none';
            details.style.display = isHidden ? 'block' : 'none';
            cardElement.classList.toggle('selected');
            if (isHidden) {
               details.style.display = 'block';
               icon.textContent = '-';
            } else {
              details.style.display = 'none';
              icon.textContent = '+';
            }
        });

        //e) put the card on the page
        container.appendChild(cardElement);
    });
</script>

<footer>
    <p style="text-align: center; margin-top: 50px;">&copy; 2026 My Basic Portfolio - Built with HTML, CSS, JavaScript, and uploaded with GitHub by Jo-D. All rights reserved.</p>
</footer>
</body>
